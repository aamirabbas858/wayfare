name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build is part of CI because Next resolves environment variables at
      # build time, and a missing one has already broken a deploy here. It runs
      # with no secrets on purpose: anything that cannot build without a key is
      # a route that would take the whole site down when that key is absent.
      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
